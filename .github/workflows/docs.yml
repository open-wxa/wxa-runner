name: Docs

# 用 VitePress 构建 docs/ 下的使用文档，推送到 main 时部署到 GitHub Pages；PR 里只构建，检查死链。
# 仓库设置里要先选 Settings → Pages → Build and deployment → Source:「GitHub Actions」
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # 导航栏显示的版本号取自 package.json，发版后跟着更新
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 连着推几次时，只跑最新的构建，旧的直接取消；推送到 main 的部署不取消，依次排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 「最后更新于」和 sitemap 的 lastmod 取自每个文件的 git 记录
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 有死链时构建失败
      - run: pnpm docs:build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # 连续推送时依次部署，不取消正在进行的部署
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
